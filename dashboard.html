<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ggnfs-sieve dashboard</title>
<style>
  body  { font-family: -apple-system, system-ui, sans-serif; margin: 2em; max-width: 1200px; color: #222; }
  h1, h2 { font-weight: 500; }
  h1 { margin-bottom: 0.2em; }
  .sub { color: #888; margin-bottom: 1.5em; font-size: 0.9em; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 0.8em; margin: 1em 0; }
  .stat { border: 1px solid #ddd; padding: 0.8em; border-radius: 4px; background: #fafafa; }
  .stat .num { font-size: 1.5em; font-family: ui-monospace, Consolas, monospace; }
  .stat .lbl { color: #666; font-size: 0.85em; margin-top: 0.2em; }
  table { border-collapse: collapse; width: 100%; margin-top: 0.5em; font-size: 0.95em; }
  th, td { text-align: left; padding: 0.45em 0.6em; border-bottom: 1px solid #eee; }
  th { background: #f4f4f4; font-weight: 500; }
  td.num, th.num { text-align: right; font-family: ui-monospace, Consolas, monospace; }
  tr.active { background: #eff7ee; }
  tr.stale  { color: #aaa; }
  tr.worker { background: #fcfcfc; font-size: 0.92em; }
  tr.worker.active { background: #f3faf2; }
  tr.worker td:first-child { padding-left: 2.2em; color: #555; }
  .client-toggle { border: 0; background: transparent; color: inherit; cursor: pointer; font: inherit; padding: 0; }
  .client-toggle .twisty { display: inline-block; width: 1.2em; color: #666; font-family: ui-monospace, Consolas, monospace; }
  .progress { height: 22px; background: #eee; border-radius: 11px; overflow: hidden; margin: 0.6em 0; display: flex; }
  .progress > div { height: 100%; }
  .b-verified  { background: #2e7d32; }
  .b-submitted { background: #66bb6a; }
  .b-leased    { background: #fb8c00; }
  .b-failed    { background: #d32f2f; }
  .b-poisoned  { background: #6a1b9a; }
  .legend { font-size: 0.85em; color: #555; }
  .legend span { display: inline-block; margin-right: 1em; }
  .legend .swatch { display: inline-block; width: 0.7em; height: 0.7em; vertical-align: middle; margin-right: 0.3em; border-radius: 2px; }
  .err  { color: #c00; }
  .warn { color: #888; }
  .age  { color: #666; font-size: 0.9em; margin-top: 1em; }
  code  { background: #f4f4f4; padding: 1px 4px; border-radius: 3px; }
</style>
</head>
<body>
<h1>ggnfs-sieve <span id="job-id"></span></h1>
<div class="sub" id="server-line"></div>

<div id="auth-warn" class="err" style="display:none">
  No token. Append <code>?token=&lt;your-token&gt;</code> to the URL.
</div>

<div id="content" style="display:none">
  <div class="grid">
    <div class="stat"><div class="num" id="wu-pct">&mdash;</div><div class="lbl">complete</div></div>
    <div class="stat"><div class="num" id="wu-active">&mdash;</div><div class="lbl">in flight</div></div>
    <div class="stat"><div class="num" id="rels-total">&mdash;</div><div class="lbl">relations submitted</div></div>
    <div class="stat"><div class="num" id="rate-1h">&mdash;</div><div class="lbl">workunits / hr (last 1h)</div></div>
    <div class="stat"><div class="num" id="eta">&mdash;</div><div class="lbl">ETA (last 1h rate)</div></div>
    <div class="stat"><div class="num" id="uptime">&mdash;</div><div class="lbl">server uptime</div></div>
  </div>

  <div class="progress" id="bar"></div>
  <div class="legend" id="bar-legend"></div>

  <h2>Clients</h2>
  <table>
    <thead><tr>
      <th>id</th>
      <th class="num">workers</th>
      <th>class</th>
      <th>last seen</th>
      <th class="num">workunits</th>
      <th class="num">relations</th>
      <th class="num">rel/wu</th>
      <th class="num">avg sec</th>
      <th class="num">fail</th>
      <th>current</th>
    </tr></thead>
    <tbody id="clients"></tbody>
  </table>

  <p class="age">last update: <span id="updated">never</span> &middot; auto-refresh 5s</p>
</div>

<script>
(function () {
  var params = new URLSearchParams(location.search);
  var token  = params.get('token');
  if (!token) {
    document.getElementById('auth-warn').style.display = 'block';
    return;
  }
  document.getElementById('content').style.display = 'block';

  function fmt(n) { return (n || 0).toLocaleString(); }
  function fmtSec(s) {
    if (s == null) return '0s';
    if (s < 60)    return Math.round(s) + 's';
    if (s < 3600)  return (s/60).toFixed(1) + 'm';
    if (s < 86400) return (s/3600).toFixed(1) + 'h';
    return (s/86400).toFixed(1) + 'd';
  }
  function fmtEta(seconds) {
    if (!isFinite(seconds) || seconds < 0) return 'unknown';
    if (seconds === 0) return 'complete';

    var minutes = Math.max(1, Math.ceil(seconds / 60));
    var hour = 60;
    var day = 24 * hour;
    var month = 30 * day;
    var year = 365 * day;

    if (minutes < hour) return minutes + 'm';
    if (minutes < day) {
      var hours = Math.floor(minutes / hour);
      var mins = minutes % hour;
      return hours + 'h' + (mins ? ' ' + mins + 'm' : '');
    }
    if (minutes < month) {
      var days = Math.floor(minutes / day);
      var remainingHours = Math.floor((minutes % day) / hour);
      return days + 'd' + (remainingHours ? ' ' + remainingHours + 'h' : '');
    }
    if (minutes < year) {
      var months = Math.floor(minutes / month);
      var remainingDays = Math.floor((minutes % month) / day);
      return months + 'mo' + (remainingDays ? ' ' + remainingDays + 'd' : '');
    }

    var years = Math.floor(minutes / year);
    var afterYears = minutes % year;
    var remainingMonths = Math.floor(afterYears / month);
    var remainingDays = Math.floor((afterYears % month) / day);
    return years + 'y' +
      (remainingMonths ? ' ' + remainingMonths + 'mo' : '') +
      (remainingDays ? ' ' + remainingDays + 'd' : '');
  }
  function ageText(unix) {
    if (!unix) return 'never';
    var dt = Math.floor(Date.now()/1000) - unix;
    if (dt < 0)    dt = 0;
    if (dt < 60)   return dt + 's ago';
    if (dt < 3600) return Math.floor(dt/60)   + 'm ago';
    if (dt < 86400)return Math.floor(dt/3600) + 'h ago';
    return Math.floor(dt/86400) + 'd ago';
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  var expandedClients = {};

  document.getElementById('clients').addEventListener('click', function (ev) {
    var btn = ev.target.closest && ev.target.closest('.client-toggle');
    if (!btn) return;
    var id = btn.getAttribute('data-client');
    expandedClients[id] = !expandedClients[id];
    var last = window.__lastStats;
    if (last) render(last);
  });

  function clientGroupId(id) {
    // Worker ids are "<box>-w<N>"; a pipelined worker's lease slots add
    // "-s<K>" on top of that ("<box>-w0-s1"). Strip both so one machine is one
    // row, however many slots it is prefetching with.
    return String(id || '').replace(/-w[0-9]+(-s[0-9]+)?$/, '');
  }

  function weightedAvg(totalSeconds, count) {
    return count > 0 ? totalSeconds / count : 0;
  }

  function relationsPerWorkunit(relations, workunits) {
    if (!workunits) return '&mdash;';
    return (relations / workunits).toLocaleString(undefined, {
      minimumFractionDigits: 1,
      maximumFractionDigits: 1
    });
  }

  function groupClients(clients) {
    var groupsById = {};
    var groups = [];
    for (var i = 0; i < clients.length; i++) {
      var c = clients[i];
      var id = clientGroupId(c.id);
      var g = groupsById[id];
      if (!g) {
        g = {
          id: id,
          first_seen: c.first_seen || 0,
          last_seen: c.last_seen || 0,
          submissions: 0,
          relations: 0,
          total_failures: 0,
          avg_total_seconds: 0,
          current_count: 0,
          klass: '',
          workers: []
        };
        groupsById[id] = g;
        groups.push(g);
      }
      var submissions = c.submissions || 0;
      g.workers.push(c);
      if (!g.first_seen || (c.first_seen && c.first_seen < g.first_seen)) g.first_seen = c.first_seen;
      if ((c.last_seen || 0) > g.last_seen) g.last_seen = c.last_seen || 0;
      g.submissions += submissions;
      g.relations += c.relations || 0;
      g.total_failures += c.total_failures || 0;
      g.avg_total_seconds += (c.avg_sieve_seconds || 0) * submissions;
      if (c.current_workunit) g.current_count++;
      // A box whose workers disagree about class is worth seeing: it usually
      // means one of them was started with the wrong --lease-class.
      var wc = c["class"] || '';
      if (wc) g.klass = (!g.klass || g.klass === wc) ? wc : 'mixed';
    }
    for (var j = 0; j < groups.length; j++) {
      groups[j].avg_sieve_seconds = weightedAvg(groups[j].avg_total_seconds, groups[j].submissions);
      groups[j].workers.sort(function (a, b) {
        return String(a.id).localeCompare(String(b.id), undefined, { numeric: true });
      });
    }
    groups.sort(function (a, b) { return (b.last_seen || 0) - (a.last_seen || 0); });
    return groups;
  }

  function rowState(lastSeen, activeCount) {
    var dt = Math.floor(Date.now()/1000) - (lastSeen || 0);
    if (activeCount) return 'active';
    if (dt > 300) return 'stale';
    return '';
  }

  function render(s) {
    window.__lastStats = s;
    document.getElementById('job-id').textContent     = '— job ' + s.job_id;
    document.getElementById('server-line').textContent =
      'siever ' + s.siever + ' / side ' + s.side +
      ' / lease ' + s.lease_seconds + 's' +
      ' / sweep ' + s.sweep_seconds + 's';

    var w    = s.workunits;
    // Progress is measured in q-width, not workunit count. A gpu-class band is
    // ~100x a cpu-class one, so "10 of 20 done" can mean anything between 1%
    // and 99% of the actual sieving. Fall back to counts against an older
    // server that does not report the q object.
    var q       = w.q || null;
    var qTotal  = q ? (q.total || 0) : 0;
    var byWidth = qTotal > 0;
    var done    = byWidth ? ((q.submitted || 0) + (q.verified || 0))
                          : ((w.submitted || 0) + (w.verified || 0));
    var total   = byWidth ? qTotal : (w.total || 0);
    var pct     = total ? (100 * done / total) : 0;
    document.getElementById('wu-pct').textContent     = pct.toFixed(1) + '%';
    document.getElementById('wu-active').textContent  = fmt(w.leased);
    document.getElementById('rels-total').textContent = fmt(s.submissions.total_relations);
    document.getElementById('rate-1h').textContent    = fmt(s.submissions.last_1h);
    document.getElementById('uptime').textContent     = fmtSec(s.uptime_seconds);

    // ETA in the same units as progress: q-width remaining over q-width
    // completed per hour. Counting submissions per hour would mix a 6-minute
    // GPU band with a 26-minute CPU one and read badly wrong on a mixed fleet.
    var remaining, hourlyRate;
    if (byWidth) {
      remaining  = (q.leased || 0) + (q.available || 0);
      hourlyRate = w.q_passed_1h || 0;
    } else {
      remaining  = (w.leased || 0) + (w.available || 0);
      hourlyRate = s.submissions.last_1h || 0;
    }
    var eta = document.getElementById('eta');
    eta.removeAttribute('title');
    if (remaining === 0) {
      eta.textContent = 'complete';
    } else if (hourlyRate <= 0) {
      eta.textContent = 'unknown';
    } else {
      var etaSeconds = remaining * 3600 / hourlyRate;
      eta.textContent = fmtEta(etaSeconds);
      eta.title = 'Estimated finish: ' +
        new Date(Date.now() + etaSeconds * 1000).toLocaleString();
    }

    var bar  = document.getElementById('bar');
    bar.innerHTML = '';
    // Segment widths are q-width too, so the bar shows how much of the
    // campaign each state covers rather than how many rows are in it.
    var src  = byWidth ? q : w;
    var segs = [
      ['verified',  src.verified  || 0, 'b-verified'],
      ['submitted', src.submitted || 0, 'b-submitted'],
      ['leased',    src.leased    || 0, 'b-leased'],
      ['failed',    src.failed    || 0, 'b-failed'],
      ['poisoned',  src.poisoned  || 0, 'b-poisoned']
    ];
    if (total > 0) {
      for (var i = 0; i < segs.length; i++) {
        var name = segs[i][0], n = segs[i][1], cls = segs[i][2];
        if (!n) continue;
        var d = document.createElement('div');
        d.className = cls;
        d.style.flex = String(n);
        d.title = name + ': ' + fmt(n) + (byWidth ? ' q' : '');
        bar.appendChild(d);
      }
      var avail = src.available || 0;
      if (avail > 0) {
        var d2 = document.createElement('div');
        d2.style.flex = String(avail);
        d2.style.background = '#eee';
        d2.title = 'available: ' + fmt(avail) + (byWidth ? ' q' : '');
        bar.appendChild(d2);
      }
    }
    var classLine = '';
    if (s.classes && s.classes.length > 1) {
      var parts = [];
      for (var ci = 0; ci < s.classes.length; ci++) {
        var c = s.classes[ci];
        parts.push(c.name + ' ' + c.verified + '/' + c.total +
                   ' (q ' + fmt(c.q_verified) + '/' + fmt(c.q_total) + ')');
      }
      classLine = ' &middot; ' + parts.join(' &middot; ');
    }
    document.getElementById('bar-legend').innerHTML =
      (byWidth
        ? fmt(done) + ' / ' + fmt(total) + ' q-width done'
        : done + ' / ' + w.total + ' workunits done') +
      ' &middot; ' + (w.verified || 0) + '/' + (w.total || 0) + ' workunits' +
      ' &middot; ' + (w.leased || 0) + ' in flight' +
      ' &middot; ' + (w.available || 0) + ' pending' +
      ' &middot; q range ' + fmt(w.q_min) + '&ndash;' + fmt(w.q_max) +
      classLine +
      '<br>' +
      '<span><span class="swatch b-verified"></span>verified</span>' +
      '<span><span class="swatch b-submitted"></span>submitted</span>' +
      '<span><span class="swatch b-leased"></span>leased</span>' +
      '<span><span class="swatch b-failed"></span>failed</span>' +
      '<span><span class="swatch b-poisoned"></span>poisoned</span>';

    var tbody = document.getElementById('clients');
    tbody.innerHTML = '';
    var clients = s.clients || [];
    if (clients.length === 0) {
      var tr = document.createElement('tr');
      tr.innerHTML = '<td colspan="10" class="warn">no clients have connected yet</td>';
      tbody.appendChild(tr);
    } else {
      var groups = groupClients(clients);
      for (var j = 0; j < groups.length; j++) {
        var c  = groups[j];
        var isOpen = !!expandedClients[c.id];
        var tr = document.createElement('tr');
        tr.className = rowState(c.last_seen, c.current_count);
        var current = c.current_count ? fmt(c.current_count) + ' active' : '';
        tr.innerHTML =
          '<td><button type="button" class="client-toggle" data-client="' + escapeHtml(c.id) + '">' +
          '<span class="twisty">' + (isOpen ? '-' : '+') + '</span>' +
          escapeHtml(c.id) + '</button></td>' +
          '<td class="num">' + fmt(c.workers.length) + '</td>' +
          '<td>' + escapeHtml(c.klass || '') + '</td>' +
          '<td>' + ageText(c.last_seen) + '</td>' +
          '<td class="num">' + fmt(c.submissions) + '</td>' +
          '<td class="num">' + fmt(c.relations) + '</td>' +
          '<td class="num">' + relationsPerWorkunit(c.relations, c.submissions) + '</td>' +
          '<td class="num">' + (c.avg_sieve_seconds || 0).toFixed(1) + '</td>' +
          '<td class="num">' + (c.total_failures ? c.total_failures : '') + '</td>' +
          '<td>' + escapeHtml(current) + '</td>';
        tbody.appendChild(tr);
        if (isOpen) {
          for (var k = 0; k < c.workers.length; k++) {
            var wkr = c.workers[k];
            var wr = document.createElement('tr');
            wr.className = 'worker ' + rowState(wkr.last_seen, wkr.current_workunit ? 1 : 0);
            wr.innerHTML =
              '<td>' + escapeHtml(wkr.id) + '</td>' +
              '<td class="num">1</td>' +
              '<td>' + escapeHtml(wkr["class"] || '') + '</td>' +
              '<td>' + ageText(wkr.last_seen) + '</td>' +
              '<td class="num">' + fmt(wkr.submissions) + '</td>' +
              '<td class="num">' + fmt(wkr.relations) + '</td>' +
              '<td class="num">' + relationsPerWorkunit(wkr.relations, wkr.submissions) + '</td>' +
              '<td class="num">' + (wkr.avg_sieve_seconds || 0).toFixed(1) + '</td>' +
              '<td class="num">' + (wkr.total_failures ? wkr.total_failures : '') + '</td>' +
              '<td>' + escapeHtml(wkr.current_workunit || '') + '</td>';
            tbody.appendChild(wr);
          }
        }
      }
    }

    document.getElementById('updated').textContent = new Date().toLocaleTimeString();
  }

  var statsFetch = null;
  var statsTimeout = null;

  function finishPoll() {
    if (statsTimeout) clearTimeout(statsTimeout);
    statsTimeout = null;
    statsFetch = null;
  }

  function poll() {
    if (statsFetch) return;

    statsFetch = new AbortController();
    statsTimeout = setTimeout(function () {
      if (statsFetch) statsFetch.abort();
    }, 10000);

    fetch('/stats', {
      headers: { 'Authorization': 'Bearer ' + token },
      cache: 'no-store',
      signal: statsFetch.signal
    })
      .then(function (r) {
        if (r.status === 401) {
          document.getElementById('auth-warn').textContent = '401 — token rejected.';
          document.getElementById('auth-warn').style.display = 'block';
          document.getElementById('content').style.display   = 'none';
          throw new Error('unauthorized');
        }
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(render)
      .catch(function (e) {
        if (e && e.name === 'AbortError') return;
        console.error(e);
      })
      .finally(finishPoll);
  }
  window.addEventListener('beforeunload', function () {
    if (statsFetch) statsFetch.abort();
  });
  poll();
  setInterval(poll, 5000);
})();
</script>
</body>
</html>
